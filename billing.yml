# .github/workflows/billing.yml
# Runs automatically on the 1st of every month at 5:00 PM IST (11:30 UTC)

name: Monthly Billing Report

on:
  schedule:
    - cron: '30 11 1 * *'   # 1st of month, 11:30 UTC = 5:00 PM IST

  workflow_dispatch:         # manual / dashboard "Send now" (receiver passed in)
    inputs:
      recipients:
        description: 'Receiver email(s), comma separated (blank = default list)'
        required: false
        default: ''

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find Excel file
        run: |
          FILE=$(ls Rental_Report_*.xlsx 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "ERROR: No Excel file found in repo root. Please upload the monthly report first."
            exit 1
          fi
          echo "Found file: $FILE"
          echo "EXCEL_FILE=$FILE" >> $GITHUB_ENV

      - name: Run billing report & send email
        run: python billing_report_generator.py "$EXCEL_FILE"
        env:
          SMTP_SERVER: smtp.office365.com
          SMTP_PORT: "587"
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENTS: ${{ inputs.recipients || secrets.RECIPIENTS }}

      - name: Save reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-report
          path: |
            Billing_Message_*.txt
            Billing_Report_*.html
            Rental_Changes_*.csv
          if-no-files-found: ignore
