# Checks every 30 min whether a send was scheduled from the dashboard
# (schedule.json in the repo root). If it is due, sends the report once.
name: Scheduled Billing Send

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scheduled-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Is a scheduled send due?
        id: due
        run: |
          if [ ! -f schedule.json ]; then echo "due=no" >> $GITHUB_OUTPUT; exit 0; fi
          STATUS=$(jq -r '.status // ""' schedule.json)
          WHEN=$(jq -r '.sendAtUtc // ""' schedule.json)
          RCPT=$(jq -r '.recipients // ""' schedule.json)
          if [ "$STATUS" = "pending" ] && [ -n "$WHEN" ] && [ $(date -u +%s) -ge $(date -u -d "$WHEN" +%s) ]; then
            echo "due=yes" >> $GITHUB_OUTPUT
            echo "rcpt=$RCPT" >> $GITHUB_OUTPUT
          else
            echo "due=no" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.due.outputs.due == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.due.outputs.due == 'yes'
        run: pip install -r requirements.txt

      - name: Send report
        if: steps.due.outputs.due == 'yes'
        run: |
          FILE=$(ls Rental_Report_*.xlsx 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then echo "No Excel file uploaded"; exit 1; fi
          python billing_report_generator.py "$FILE"
        env:
          SMTP_SERVER: smtp.office365.com
          SMTP_PORT: "587"
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENTS: ${{ steps.due.outputs.rcpt }}

      - name: Mark schedule as sent
        if: steps.due.outputs.due == 'yes' && success()
        run: |
          jq '.status="sent" | .sentAtUtc=(now|todate)' schedule.json > s.tmp && mv s.tmp schedule.json
          git config user.name "billing-bot"; git config user.email "billing-bot@users.noreply.github.com"
          git add schedule.json && git commit -m "Scheduled send completed" && git push
